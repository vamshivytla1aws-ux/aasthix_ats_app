<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AASTHIX ATS - Offline</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #0f172a, #111827);
        color: #e2e8f0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(640px, calc(100vw - 48px));
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.8);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 24px 64px rgba(2, 6, 23, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.5;
      }
      .btns {
        margin-top: 22px;
        display: flex;
        gap: 12px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        background: #4f46e5;
        color: #fff;
      }
      .ghost {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
      }
      code {
        display: inline-block;
        margin-top: 14px;
        background: #0b1220;
        color: #e2e8f0;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>AASTHIX ATS is temporarily unreachable</h1>
      <p id="reason">Please check your network connection and retry.</p>
      <code id="target"></code>
      <div class="btns">
        <button class="primary" onclick="window.location.reload()">Retry</button>
        <button class="ghost" onclick="window.close()">Close</button>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const target = params.get("target");
      const reason = params.get("reason");
      if (target) document.getElementById("target").textContent = `Target URL: ${target}`;
      if (reason) document.getElementById("reason").textContent = reason;
    </script>
  </body>
  </html>
